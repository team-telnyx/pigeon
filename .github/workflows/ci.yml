name: CI

on:
  workflow_dispatch:
  push:
    branches: ["master", "main", "v2.0.0-rc.2-base"]
  pull_request:
    branches: ["master", "main", "v2.0.0-rc.2-base"]

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
      - name: Install Prettier
        run: npm install --global prettier
      - name: Run Prettier
        run: prettier --check --no-error-on-unmatched-pattern "**/*.{json,md,yml,yaml}"
  check:
    name: Format/Credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.14.3"
          otp-version: "24.3"
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run formatter
        run: mix format --check-formatted
      - name: Run Credo
        run: mix credo
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.14.3"
          otp-version: "24.3"
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Run tests
        env:
          PIGEON_SKIP_PROVIDER_WORKERS: "true"
        run: |
          files="test/pigeon/http2_client_test.exs test/pigeon/notification_queue_test.exs test/pigeon/sandbox_test.exs"
          if [ -f test/pigeon/dispatcher_worker_test.exs ]; then
            files="$files test/pigeon/dispatcher_worker_test.exs"
          fi
          if [ -f test/pigeon/apns_closed_teardown_test.exs ]; then
            files="$files test/pigeon/apns_closed_teardown_test.exs"
          fi
          mix test $files
